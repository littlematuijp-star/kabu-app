name: 株価データの毎日更新

# 日本市場の大引け(15:30 JST)後に実行する。
# GitHub の cron は UTC なので、09:00 UTC = 18:00 JST。
on:
  schedule:
    - cron: "0 9 * * 1-5"     # 平日 18:00 JST
  workflow_dispatch:           # 画面から手動実行もできる

permissions:
  contents: write              # 更新結果をリポジトリに書き戻すため

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ライブラリを入れる
        run: pip install -r requirements-update.txt

      - name: 株価・配当を増分更新
        run: python update_data.py

      - name: 変更があれば書き戻す
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/packed
          if git diff --cached --quiet; then
            echo "変更なし（休場日など）。コミットしません。"
          else
            git commit -m "データ更新 $(date -u +'%Y-%m-%d')"
            git push
          fi
