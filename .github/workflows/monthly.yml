name: 決算データの月次更新

# 決算は四半期ごとにしか変わらないので月1回で十分。
# 銘柄情報(社名・セクター)の取得も含むため1時間ほどかかる。
on:
  schedule:
    - cron: "0 20 1 * *"       # 毎月1日 05:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ライブラリを入れる
        run: pip install -r requirements-update.txt

      - name: 株価・決算・銘柄情報をまとめて更新
        run: python update_data.py --full

      - name: 変更があれば書き戻す
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/packed
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
          else
            git commit -m "決算データ更新 $(date -u +'%Y-%m')"
            git push
          fi
